[package]
name = "httprs"
description = "A fast simple command line http server tool"
version = "0.2.6"
edition = "2024"
authors = ["10fish <jokefish@live.com>"]
license-file = "LICENSE"
repository = "https://github.com/10fish/httprs"
rust-version = "1.85.0"
documentation = "https://docs.rs/httprs"
readme = "README.md"
keywords = ["http", "server", "static", "tls", "partial_content"]
include = ["src/**/*", "static/**/*", "Cargo.toml", "tests/**/*", "CHANGELOG.md", "LICENSE", "README.md"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["cli", "tls", "local-ips"]
cli = ["dep:clap", "dep:tracing-subscriber", "tokio/rt-multi-thread"]
tls = ["dep:rustls", "dep:tokio-rustls"]
local-ips = ["dep:netdev"]
compression = ["dep:async-compression"]

[dependencies]
tokio = { version = "^1.54", features = ["fs", "io-util", "macros", "net", "rt", "signal", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
httpdate = "1"
sha2 = "0.10"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"] }

clap = { version = "^4", features = ["derive", "wrap_help"], optional = true }
toml = "0.8"

tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }
bytes = "^1.12"
urlencoding = "2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

rustls = { version = "0.23", default-features = false, features = ["prefer-post-quantum"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
netdev = { version = "0.35", optional = true }

[dev-dependencies]
regex = "^1.13"

[[bin]]
name = "httprs"
path = "src/bin/serve.rs"
required-features = ["cli"]

[badges]
maintenance = { status = "experimental" }
